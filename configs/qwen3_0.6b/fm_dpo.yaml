model_id: Qwen/Qwen3-0.6B-Base
method: fm_dpo
seed: 17
init_checkpoint: artifacts/checkpoints/qwen3_0.6b/seed17/sft/final
trainer: fmpt.FMDPOTrainer
dataset:
  preference_manifest: data/manifests/preference_pairs_8k.json
  domain_groups: [gsm8k, math, aime_holdout]
  evaluator_groups: [gold_exact, sympy_equiv, parser_v2]
fmpt:
  rho_domain: 0.15
  rho_evaluator: 0.10
  lambda_policy_kl: 0.25
training:
  learning_rate: 5.0e-6
  beta: 0.1
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  bf16: true
output_dir: artifacts/checkpoints/qwen3_0.6b/seed17/fm_dpo/final
eval:
  suites: [gsm8k_clean, math500_clean, shifted_domain_mix, reward_noise_10, verifier_swap]
