model_id: Qwen/Qwen3-0.6B-Base
method: fm_grpo
seed: 17
init_checkpoint: artifacts/checkpoints/qwen3_0.6b/seed17/sft/final
trainer: fmpt.FMGRPOTrainer
rollout:
  num_generations: 8
  temperature: 0.7
  max_new_tokens: 512
reward:
  type: rule_based_math
  evaluators: [gold_exact, sympy_equiv, parser_v2]
fmpt:
  rho_domain: 0.15
  rho_evaluator: 0.10
  lambda_policy_kl: 0.25
training:
  learning_rate: 1.0e-6
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  bf16: true
output_dir: artifacts/checkpoints/qwen3_0.6b/seed17/fm_grpo/final
eval:
  suites: [gsm8k_clean, math500_clean, shifted_domain_mix, hacking_suite, verifier_swap]
