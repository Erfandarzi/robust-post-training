model_id: Qwen/Qwen3-0.6B-Base
method: grpo
seed: 17
init_checkpoint: artifacts/checkpoints/qwen3_0.6b/seed17/sft/final
trainer: trl.GRPOTrainer
rollout:
  num_generations: 8
  temperature: 0.7
  max_new_tokens: 512
reward:
  type: rule_based_math
  evaluators: [gold_exact, sympy_equiv]
training:
  learning_rate: 1.0e-6
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  bf16: true
output_dir: artifacts/checkpoints/qwen3_0.6b/seed17/grpo/final
eval:
  suites: [gsm8k_clean, math500_clean, shifted_domain_mix, hacking_suite]
